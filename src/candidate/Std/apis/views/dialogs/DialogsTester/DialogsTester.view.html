<div class="DialogsTester">
    <textarea v-model="code" style="height: 280px;display: block; width: 100%; font-size: 11px;" spellcheck="false"></textarea>
    <div class="normal_button" v-on:click="runDialog">Run dialog</div>
    <div class="flex_row centered">
        <div class="flex_1 normal_button" v-on:click="() => openDialog('small')">small</div>
        <div class="flex_1 normal_button" v-on:click="() => openDialog('medium-small')">medium-small</div>
        <div class="flex_1 normal_button" v-on:click="() => openDialog('medium')">medium</div>
        <div class="flex_1 normal_button" v-on:click="() => openDialog('medium-big')">medium-big</div>
        <div class="flex_1 normal_button" v-on:click="() => openDialog('big')">big</div>
        <div class="flex_1 normal_button" v-on:click="() => openDialog('maximized')">maximized</div>
    </div>
</div>
