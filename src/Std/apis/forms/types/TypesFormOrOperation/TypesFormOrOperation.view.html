<div class="TypesFormOrOperation View">
    Or operation (left):
    <TypesFormNode :params="{
        ast: params.ast,
        astIndex: params.astIndex.concat(['left']),
        data: params.data,
        dataIndex: params.dataIndex,
    }" />
    Or operation (right):
    <div v-for="subnode, subnodeIndex in localAst.right" v-bind:key="'subnode_right_' + subnodeIndex">
        <TypesFormNode :params="{
            ast: params.ast,
            astIndex: params.astIndex.concat(['right', subnodeIndex]),
            data: params.data,
            dataIndex: params.dataIndex,
        }" />
    </div>
</div>
