<div class="DialogView View" v-on:pointerdown="focusMe">
    <div class="flex_column flex_100">
        <div class="flex_0 flex_row">
            <div class="flex_0">
                <div class="dialog_corner top_left_corner"><div
                    v-on:pointerdown="event => startResize(event, 'top+left')"
                    v-on:pointermove="event => moveResize(event, 'top+left')"
                    v-on:pointerup="event => stopResize(event, 'top+left')"
                    v-on:pointercancel="event => stopResize(event, 'top+left')"></div></div>
            </div>
            <div class="flex_100">
                <div class="dialog_border top_border"><div
                    v-on:pointerdown="event => startResize(event, 'top')"
                    v-on:pointermove="event => moveResize(event, 'top')"
                    v-on:pointerup="event => stopResize(event, 'top')"
                    v-on:pointercancel="event => stopResize(event, 'top')"></div></div>
            </div>
            <div class="flex_0">
                <div class="dialog_corner top_right_corner"><div
                    v-on:pointerdown="event => startResize(event, 'top+right')"
                    v-on:pointermove="event => moveResize(event, 'top+right')"
                    v-on:pointerup="event => stopResize(event, 'top+right')"
                    v-on:pointercancel="event => stopResize(event, 'top+right')"></div></div>
            </div>
        </div>
        <div class="flex_100 flex_row">
            <div class="flex_0">
                <div class="dialog_border left_border"><div
                    v-on:pointerdown="event => startResize(event, 'left')"
                    v-on:pointermove="event => moveResize(event, 'left')"
                    v-on:pointerup="event => stopResize(event, 'left')"
                    v-on:pointercancel="event => stopResize(event, 'left')"></div></div>
            </div>
            <div class="flex_100 dialog_box">
                <div class="dialog_header">
                    <div class="dialog_topbar">
                        <div class="dialog_title"
                            v-on:dblclick="toggleMaximize"
                            v-on:pointerdown="startDrag"
                            v-on:pointermove="moveDrag"
                            v-on:pointerup="stopDrag"
                            v-on:pointercancel="stopDrag">
                            <div class="dialog_title_text">{{ thread.title || thread.threadId || "no id found" }}</div>
                        </div>
                        <div class="dialog_topbar_buttons">
                            <div v-if="thread.parent !== $window.Std.objects.GlobalThread" class="dialog_topbar_button rounded_button light focus_parent_button" ref="focus_parent_button" v-on:click="focusParent">
                                <span class="rotate5of8">➜</span>
                            </div>
                            <div class="dialog_topbar_button rounded_button light minimize_button" ref="minimize_button" v-on:click="minimize">➖​</div>
                            <div class="dialog_topbar_button rounded_button light maximize_button" ref="maximize_button" v-on:click="toggleMaximize">​◼️</div>
                            <div class="dialog_topbar_button rounded_button light exit_button" v-on:click="close">✖️</div>
                        </div>
                    </div>
                </div>
                <div class="dialog_body" :class="getDialogBodyContainerClasses()">
                    <DynamicView :view="thread" :args="{dialog:this}" ref="body" />
                </div>
                <div class="dialog_footer">
                    <div class="dialog_buttons" v-if="thread.buttons?.length">
                        <div class="flex_100"></div>
                        <template v-for="button, buttonIndex in adaptThreadButtons()" v-if="thread.buttons">
                            <div class="flex_1 dialog_button_box" v-bind:key="'button_box_' + buttonIndex">
                                <div class="dialog_button normal_button" v-on:click="e => button.click(e, $locals.self)">{{ button.text }}</div>
                            </div>
                        </template>
                    </div>
                    <div class="dialog_status_bar" v-if="thread.statusBar?.length">
                        <template v-for="statusBox, statusIndex in thread.statusBar">
                            <div class="dialog_status_item"
                                :class="typeof statusBox.flex !== 'number' ? '' : 'flex_' + statusBox.flex"
                                v-bind:key="'statusbar_' + statusIndex">
                                <template v-if="statusBox.text">
                                    <span>{{ statusBox.text }}</span>
                                </template>
                                <template v-else-if="statusBox.html">
                                    <DynamicView :view="{template:statusBox.html,data:{statusBox}}" ref="statusBarItems" />
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
            <div class="flex_0">
                <div class="dialog_border right_border"><div
                    v-on:pointerdown="event => startResize(event, 'right')"
                    v-on:pointermove="event => moveResize(event, 'right')"
                    v-on:pointerup="event => stopResize(event, 'right')"
                    v-on:pointercancel="event => stopResize(event, 'right')"></div></div>
            </div>
        </div>
        <div class="flex_0 flex_row">
            <div class="flex_0">
                <div class="dialog_corner bottom_left_corner"><div
                    v-on:pointerdown="event => startResize(event, 'bottom+left')"
                    v-on:pointermove="event => moveResize(event, 'bottom+left')"
                    v-on:pointerup="event => stopResize(event, 'bottom+left')"
                    v-on:pointercancel="event => stopResize(event, 'bottom+left')"></div></div>
            </div>
            <div class="flex_100">
                <div class="dialog_border bottom_border"><div
                    v-on:pointerdown="event => startResize(event, 'bottom')"
                    v-on:pointermove="event => moveResize(event, 'bottom')"
                    v-on:pointerup="event => stopResize(event, 'bottom')"
                    v-on:pointercancel="event => stopResize(event, 'bottom')"></div></div>
            </div>
            <div class="flex_0">
                <div class="dialog_corner bottom_right_corner"><div
                    v-on:pointerdown="event => startResize(event, 'bottom+right')"
                    v-on:pointermove="event => moveResize(event, 'bottom+right')"
                    v-on:pointerup="event => stopResize(event, 'bottom+right')"
                    v-on:pointercancel="event => stopResize(event, 'bottom+right')"></div></div>
            </div>
        </div>
    </div>
</div>
