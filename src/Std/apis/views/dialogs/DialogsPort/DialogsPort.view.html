<div class="View DialogsPort">
    <DialogView class="GlobalDialog"
        v-for="subthread, subthreadIndex in $locals.opened"
        v-bind:key="'global_dialog_' + subthread.threadId"
        ref="currentDialogs"
        :thread="subthread" />
    <div class="DialogsPortViewButton position_fixed top_auto left_auto"
        v-on:click="openTreeView">
        <div style="padding-left:2px;padding-top:1px;padding-bottom:1px;">⭕️</div>
    </div>
</div>
