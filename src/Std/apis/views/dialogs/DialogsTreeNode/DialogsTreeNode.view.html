<div class="View DialogsTreeNode" :class="$window.Std.classes.Dialogs.port.isLastFocusedThread(thread) ? 'is_focused' : ''">
    <div class="flex_row centered dialog_tree_node_row gap_2 pad_vertical_1">
        <template v-if="level" v-for="it in new Array(level)">
            <div class="flex_0 nowrap" style="min-width: 8px;" v-bind:key="it"></div>
        </template>
        <div class="button normal flex_100 flex_justify_start unfocusable" v-on:click="goToDialog">
            <span ref="boundariesSignal">{{ port.getDialogFromThread(thread)?.$locals.isMinimized ? "🔹" : "🔷"}}</span>
            <span>{{ thread.title || thread.threadId }}</span>
        </div>
        <div class="flex_1">
            <div class="button square unfocusable" v-on:click="closeDialog"> ✖️ </div>
        </div>
    </div>
</div>
